name: Configure Supabase Test Auth
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-test-auth.yml'
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Disable email confirmation for testing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: zmbkaslkgqyxmdythvba
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"mailer_autoconfirm":true}' >/tmp/auth-update.json
          curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq '{mailer_autoconfirm,disable_signup}'
