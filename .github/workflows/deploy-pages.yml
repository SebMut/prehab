name: Deploy Prehab to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production JavaScript
        run: |
          for file in v1-app.js v1-name-onboarding.js v1-greeting-weight.js v1-auth-ux.js v1-activities.js v1-goal-plan.js v1-dashboard.js v1-account.js v1-demo-data.js v1-milestones.js v1-workout-mobile-fix.js v1-training-upgrades.js v1-video-preview.js v1-ui-refine.js v1-modal-safe.js v1-profile-cleanup.js v1-op-companion.js v1-goal-ui.js v1-training-start.js v1-plan-builder.js v1-login-gate.js v1-completion-guard.js v1-version.js supabase-rest-sync.js; do
            node --check "$file"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
