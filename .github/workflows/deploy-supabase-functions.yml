name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: zmbkaslkgqyxmdythvba
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require Supabase token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is missing"
            exit 1
          fi
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy delete-account
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy health-shortcuts
        run: supabase functions deploy health-shortcuts --project-ref "$SUPABASE_PROJECT_ID" --use-api
