name: Fix personalized plan counter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mutable plan counter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v1-goal-plan.js')
          s=p.read_text()
          old=',secondCore=Math.floor(n/2),e=0;for(let i=0;i<n;i++)'
          new=',secondCore=Math.floor(n/2);let e=0;for(let i=0;i<n;i++)'
          if old not in s:
              print('Already fixed')
          else:
              p.write_text(s.replace(old,new,1))
              print('Patched')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v1-goal-plan.js
          git commit -m "Fix personalized week plan runtime error"
          git push
